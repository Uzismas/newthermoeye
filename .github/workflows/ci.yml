name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        check: [lint, typecheck, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.check }}
        run: npm run ${{ matrix.check }}
        env:
          NEXT_TELEMETRY_DISABLED: 1

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Run contract and regression tests
        run: |
          npm run clinical-format-test
          npm run contract-test
          npm run state-test
          npm run ui-safety-test

      - name: Run production integration tests
        run: |
          npm run smoke
          npm run a11y
          npm run api
        env:
          CI: true
          # Browser flows use the Ubuntu runner's Chrome directly, without Playwright.
          CHROME_BIN: /usr/bin/google-chrome

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tmp/
            output/playwright/
          retention-days: 7

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [quality-gate, test-suite, security-check]
    if: always()

    steps:
      - name: Check status
        run: |
          if [ "${{ needs.quality-gate.result }}" != "success" ] || \
             [ "${{ needs.test-suite.result }}" != "success" ] || \
             [ "${{ needs.security-check.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          echo "✅ All checks passed"
